<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下面是我电话</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f7;
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
        }
        .container { max-width: 520px; width: 100%; }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card h2 {
            font-size: 17px;
            color: #888;
            margin: 0 0 14px 0;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .card .content {
            font-size: 20px;
            color: #1d1d1f;
            line-height: 1.7;
            word-break: break-all;
            font-family: "SF Mono", Menlo, Consolas, monospace;
        }
        .oracle .content { font-size: 24px; letter-spacing: 2px; color: #8b6914; }
        .math .content { font-size: 16px; color: #0055aa; background: #f0f6ff; padding: 12px 14px; border-radius: 10px; }
        .morse .content { font-size: 15px; color: #3a7d44; letter-spacing: 1px; }
        .footer { text-align: center; font-size: 13px; color: #aaa; margin-top: 12px; }
    </style>
</head>
<body>
<div class="container">

    <div class="card oracle">
        <h2>文科生 · 能看懂吧老弟O_v_O</h2>
        <div class="content">一三一𠄡六𠄡𠄡𠄡三三九</div>
    </div>

   <div class="card math">
        <h2>理科生 · 我初中老弟都会算</h2>
        <div class="content">
            N = cos(0)·10¹⁰ + √9·10⁹ + sin(90°)·10⁸ + √25·10⁷ + 3!·10⁶<br>
            &nbsp;&nbsp;&nbsp;&nbsp; + √25·10⁵ + √25·10⁴ + √25·10³ + √9·10² + √9·10¹ + 3²<br>
            = <strong>算出来是什么了嘛~</strong>
        </div>
    </div>

    <div class="card morse">
        <h2>三角洲</h2>
        <div class="content">
            .----   ...--  .----
            .....   -....  .....  ..... 
            .....   ...--  ...--  ----.
        </div>
    </div>

    <div class="footer"></div>

</div>
</body>
</html>
